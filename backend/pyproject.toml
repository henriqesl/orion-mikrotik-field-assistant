[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-field-backend"
version = "0.5.0"
description = "Backend do ORION MikroTik Field Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.0",
    "routeros-py==1.1.0",
    "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.9.1",
    "pyinstaller==6.21.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
